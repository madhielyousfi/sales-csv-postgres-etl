[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-etl"
version = "0.1.0"
description = "A beginner-friendly CSV to PostgreSQL sales pipeline"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["sales_etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]
