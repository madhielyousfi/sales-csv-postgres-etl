services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales_local
      POSTGRES_DB: sales
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sales_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  sales_data:
